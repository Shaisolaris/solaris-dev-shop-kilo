name: Native Kilo package conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-kilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Shaisolaris/solaris-dev-shop-plugins
          ref: 2e51c951ce4573c0ab7c5cc807118d6e0c5b815c
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Exact payload and bounded publication support files
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          expected=Path('reference/harnesses/kilo');actual=Path('package')
          names={p.relative_to(expected).as_posix() for p in expected.rglob('*') if p.is_file()}
          found={p.relative_to(actual).as_posix() for p in actual.rglob('*') if p.is_file() and '.git' not in p.relative_to(actual).parts}
          extras={'.github/workflows/native-kilo.yml','NATIVE-INSTALL.md','NATIVE-QA.json','SOLARIS-DISTRIBUTION-SOURCE.json','tools/verify-native-kilo.py'}
          assert found==names|extras,sorted(found^(names|extras))
          for name in names:
              a=actual/name;b=expected/name
              assert not a.is_symlink() and a.read_bytes()==b.read_bytes(),name
              assert bool(a.stat().st_mode&0o111)==bool(b.stat().st_mode&0o111),name
          PYTHON
      - name: Prepare pinned native CLI and helper prerequisite
        run: |
          npm install --prefix "$RUNNER_TEMP/solaris-kilo-host" --ignore-scripts --no-audit --no-fund @kilocode/cli@7.8.15
          python -m pip install PyYAML==6.0.3
      - name: Actual public Git install, 62 complete native bodies, source bytes and callers
        env:
          SOURCE_REVISION: cfd9a91b475f7f3ab3f1d815cd959e4b07aaefd2
        run: |
          python -B package/tools/verify-native-kilo.py --cli "$RUNNER_TEMP/solaris-kilo-host/node_modules/.bin/kilo" --reference reference/harnesses/kilo --ref "$SOURCE_REVISION" --work "$RUNNER_TEMP/solaris-kilo-test"
